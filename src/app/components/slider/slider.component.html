<section>
  <article>
    <h2>Best Seller</h2>
    <div class="carousel">
      <div class="carousel-inner">
        <ul *ngFor="let slide of slides; let i = index" class="carousel__item"
          [class.carousel__item--main]="i === currentIndex"
          [class.carousel__item--left]="i === (currentIndex - 1 + slides.length) % slides.length"
          [class.carousel__item--right]="i === (currentIndex + 1) % slides.length">
          <li>
            <a [href]="slide.url">
              <img [src]="slide.image" alt="carousel">
            </a>
            <div class="carousel__item-content">
              <h4>{{ slide.name }}</h4>
              <p>{{ slide.price }}</p>
            </div>
          </li>
        </ul>
      </div>
      <button class="prev" (click)="prevSlide()">&#10094;</button>
      <button class="next" (click)="nextSlide()">&#10095;</button>
    </div>
    <div class="carousel-indicators">
      <span *ngFor="let slide of slides; let i = index" [class.active]="i === currentIndex"
        (click)="goToSlide(i)"></span>
    </div>
  </article>
</section>
