<!-- delivery-form.component.html -->
<section>
    <div class="form-container">
        <!-- Stepper -->
        <div class="stepper">
            <div class="step active">
                <div class="step-icon">✔</div>
                <p>Validation du panier</p>
                <ul class="cart-items">
                    <li *ngFor="let cartItem of cart.items">
                        <img class="product-img" [src]="cartItem.product.img_url" [alt]="cartItem.product.title">
                    </li>
                </ul>
            </div>
            <div class="step">
                <div class="step-icon">2</div>
                <p>Livraison</p>
            </div>
            <div class="step">
                <div class="step-icon">3</div>
                <p>Paiement</p>
            </div>
        </div>

        <!-- Formulaire de Livraison -->
        <article class="delivery-section">
            <form [formGroup]="deliveryForm">
                <div class="input-short">
                    <div class="form-group">
                        <label for="delivery_name">*Nom</label>
                        <input class="input-without-border" type="text" id="delivery_name"
                            formControlName="delivery_name"
                            [class.hasError]="validationError.includes('delivery_name')">
                    </div>
                    <div class="form-group">
                        <label for="delivery_firstname">*Prénom</label>
                        <input class="input-without-border" type="text" id="delivery_firstname"
                            formControlName="delivery_firstname"
                            [class.hasError]="validationError.includes('delivery_firstname')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="delivery_country">*Pays / Région</label>
                    <input class="input-without-border" type="text" id="delivery_country"
                        formControlName="delivery_country"
                        [class.hasError]="validationError.includes('delivery_country')">
                </div>
                <div class="form-group">
                    <label for="delivery_street">*Adresse</label>
                    <input class="input-without-border" type="text" id="delivery_street"
                        formControlName="delivery_street"
                        [class.hasError]="validationError.includes('delivery_street')">
                </div>
                <div class="form-group">
                    <label for="delivery_floor">Bat, étage, esc...</label>
                    <input class="input-without-border" type="text" id="delivery_floor" formControlName="delivery_floor"
                        [class.hasError]="validationError.includes('delivery_floor')">
                </div>
                <div class="input-short">
                    <div class="form-group">
                        <label for="delivery_postcode">*Code Postal</label>
                        <input class="input-without-border" type="text" id="delivery_postcode"
                            formControlName="delivery_postcode"
                            [class.hasError]="validationError.includes('delivery_postcode')">
                    </div>
                    <div class="form-group">
                        <label for="delivery_city">*Ville</label>
                        <input class="input-without-border" type="text" id="delivery_city"
                            formControlName="delivery_city"
                            [class.hasError]="validationError.includes('delivery_city')">
                    </div>
                </div>
                <div class="form-group">
                    <label for="delivery_phone">*Téléphone</label>
                    <input class="input-without-border" type="text" id="delivery_phone" formControlName="delivery_phone"
                        [class.hasError]="validationError.includes('delivery_phone')">
                </div>
                <button class="button-filled" type="submit" (click)="onDelivery()">Envoyer</button>
            </form>
        </article>
    </div>
</section>
