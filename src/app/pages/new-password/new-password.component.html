<section>
  <div class="container">
    <img src="assets/img/new-password.png" alt="Panier vide">
    <h2>Oh non vous avez oublié votre mot de passe !</h2>
    <p>Saisissez votre e-mail pour réinitialiser votre mot de passe.</p>

    <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <input type="email" formControlName="email" id="email" class="form-control input-with-border" placeholder="Entrez votre adresse mail"
          [ngClass]="{ 'is-invalid': submitted && f['email'].errors }" />
        <div *ngIf="submitted && f['email'].errors" class="invalid-feedback">
          <div *ngIf="f['email'].errors['required']">L'email est requis</div>
          <div *ngIf="f['email'].errors['email']">L'email n'est pas valide</div>
        </div>
      </div>
      <div class="form-group">
        <input type="password" formControlName="newPassword" id="newPassword" class="form-control input-with-border" placeholder="Entrez votre nouveau mot de passe"
          [ngClass]="{ 'is-invalid': submitted && f['newPassword'].errors }" />
        <div *ngIf="submitted && f['newPassword'].errors" class="invalid-feedback">
          <div *ngIf="f['newPassword'].errors['required']">Le nouveau mot de passe est requis</div>
          <div *ngIf="f['newPassword'].errors['minlength']">Le mot de passe doit contenir au moins 12 caractères</div>
        </div>
      </div>
      <div *ngIf="errorMessage" class="alert alert-danger">{{ errorMessage }}</div>
      <div class="form-group">
        <button type="submit" class="button-filled">Réinitialiser le mot de passe</button>
      </div>
    </form>
  </div>
</section>
